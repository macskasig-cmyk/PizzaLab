name: Import PizzaLab project archive
on:
  push:
    branches: [main]
    paths:
      - "project-archive.done"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project archive
        run: |
          cat project-archive.part-* > /tmp/project.zip.b64
          base64 -d /tmp/project.zip.b64 > /tmp/project.zip
          mkdir -p /tmp/pizzalab
          unzip -o /tmp/project.zip -d /tmp/pizzalab
          cp -R /tmp/pizzalab/PizzaLab/. .
          rm -f project-archive.part-* project-archive.done
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete PizzaLab app source" || exit 0
          git push
